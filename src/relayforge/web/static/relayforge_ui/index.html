<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استودیو رله‌فورج</title>
  <link rel="stylesheet" href="/static/relayforge_ui/studio.css">
  <script type="module" src="/static/relayforge_ui/studio.js"></script>
</head>
<body>
<header><strong>استودیو رله‌فورج</strong><label id="workspace-control" hidden>فضای کاری
  <select id="workspace"></select></label></header>
<main>
  <section id="entry">
    <h1>ورود به استودیو</h1>
    <form id="login">
      <label>ایمیل <input name="email" type="email" dir="ltr" required autocomplete="username"></label>
      <label>شناسه مستأجر <input name="tenant_slug" dir="ltr" autocomplete="organization"></label>
      <label>گذرواژه <input name="password" type="password" required autocomplete="current-password"></label>
      <button>ورود</button>
    </form>
  </section>
  <div id="studio" hidden>
    <nav aria-label="بخش‌های استودیو"></nav>
    <section id="view"><h1 id="title"></h1><div id="actions"></div><div id="results"></div></section>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
