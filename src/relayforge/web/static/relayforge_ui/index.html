<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>استودیو رله‌فورج</title>
<link rel="stylesheet" href="/static/relayforge_ui/studio.css">
<script type="module" src="/static/relayforge_ui/studio.js"></script>
</head>
<body>
<header id="topbar" hidden>
  <button id="menu" class="secondary mobile" aria-label="منو" aria-expanded="false">منو</button>
  <a class="brand" href="/"><span class="mark" aria-hidden="true">R</span><span>استودیو رله‌فورج<small>RelayForge Studio</small></span></a>
  <div class="tools">
    <select aria-label="فضای کاری" id="workspace"></select>
    <span class="pill" id="engine"></span>
    <button class="secondary" id="bell" aria-label="اعلان‌ها" aria-expanded="false"><span id="bell-icon"></span><span id="unread"></span></button>
    <button id="stop" class="danger">توقف اضطراری</button>
    <a class="secondary button" href="/operator">پنل اپراتور</a>
    <button id="logout" class="secondary">خروج</button>
  </div>
</header>
<main>
  <section id="entry" class="auth">
    <div class="mark" aria-hidden="true">R</div><p class="brand-label">استودیو رله‌فورج</p>
    <h1>ورود به حساب کاربری</h1>
    <form id="login">
      <label>ایمیل <input name="email" type="email" dir="ltr" required autocomplete="username" placeholder="name@example.com"></label>
      <label>نامک مستأجر <small>اختیاری</small><input name="tenant_slug" dir="ltr" autocomplete="organization" placeholder="org-alpha"></label>
      <label>گذرواژه <input name="password" type="password" dir="ltr" required autocomplete="current-password"></label>
      <button type="button" id="eye" class="secondary" aria-pressed="false">نمایش گذرواژه</button>
      <button type="submit">ورود به استودیو</button>
    </form>
    <a class="auth-footer" href="/operator">ورود به پنل اپراتور</a>
  </section>
  <div id="studio" hidden>
    <aside id="sidebar"><p class="nav-title">فضای کاری</p><nav aria-label="بخش‌های استودیو"></nav></aside>
    <section id="view"><div class="heading"><p>استودیو / فضای کاری</p><h1 id="title"></h1></div><div id="results" tabindex="-1"></div><div id="actions"></div></section>
  </div>
  <section id="operator" hidden></section>
</main>
<aside id="notifications" class="notification-drawer" hidden aria-label="اعلان‌ها"></aside>
<dialog id="confirmation"><form method="dialog"><h2 id="confirmation-title"></h2><p id="confirmation-copy"></p><div class="toolbar"><button value="cancel" class="secondary" autofocus>انصراف</button><button value="confirm">تأیید عملیات</button></div></form></dialog>
<div id="status" role="status" aria-live="polite" hidden></div>
</body>
</html>
