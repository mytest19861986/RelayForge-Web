[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "relayforge"
version = "2.0.0a0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4.0",
    "django>=5.2,<5.3",
    "django-ninja>=1.3,<2.0",
    "pydantic>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=43.0,<47.0",
    "httpx>=0.27,<1.0",
    "ijson>=3.3,<4.0",
    "Pillow>=10.4,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
    "import-linter>=2.1,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
