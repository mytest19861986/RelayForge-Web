name: M0 through M8 gates

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "127.0.0.1:55432:5432"
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      RF_EVIDENCE_OUT: tmp/m7-oc06-db-evidence.json
      RF_OC02_EVIDENCE_OUT: tmp/m7-oc02-evidence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core postgresql-16 postgresql-client-16
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: lint-imports
      - run: python scripts/gates/check_ast_gates.py
      - run: python scripts/gates/check_supply_chain.py
      - run: python scripts/gates/verify_ubuntu2404_host.py --require-ubuntu-2404
      - run: bash scripts/gates/docker_production_smoke.sh
      - run: pytest -v tests/unit tests/integration -s
      - uses: actions/upload-artifact@v4
        with:
          name: m7-acceptance-evidence
          path: tmp/*.json
          if-no-files-found: error
